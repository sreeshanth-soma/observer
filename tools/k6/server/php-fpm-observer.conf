; PHP-FPM pool for Observer k6 load testing
; This runs separately from any system PHP-FPM to avoid conflicts.
;
; Workers: pm.max_children controls how many parallel PHP requests can run.
;   10 VUs  → 5 workers is fine
;   100 VUs → 20 workers recommended
;   1000 VUs → 50+ workers (requires tuning max_children + system limits)

[observer-k6]
; __USER__ and __GROUP__ are replaced by run.sh at startup with the current
; system user, so PHP can access media_data/ and MySQL without permission issues.
user = __USER__
group = __GROUP__

; Use a separate socket so we don't conflict with any existing PHP-FPM
listen = 127.0.0.1:9099
listen.allowed_clients = 127.0.0.1

; Process manager: 'static' gives predictable concurrency for load testing.
; 'dynamic' is better for production but adds warm-up variance to test results.
pm = static
pm.max_children = 20

; Environment: PHP-FPM clears env by default, but Observer needs ffprobe/ffmpeg in PATH.
; clear_env defaults to yes in PHP-FPM, which strips PATH entirely.
clear_env = no

; Logging
php_admin_value[error_log] = /tmp/ob-k6-php-fpm.log
php_admin_flag[log_errors] = on

; Prevent workers from accumulating memory leaks during long test runs
pm.max_requests = 500
