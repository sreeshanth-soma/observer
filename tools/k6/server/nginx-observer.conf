# Nginx config for Observer k6 load testing
# Runs on port 8080 to avoid conflicting with the PHP dev server on 8000.
#
# Usage (managed by run.sh automatically):
#   nginx -c $(pwd)/server/nginx-observer.conf
#   nginx -c $(pwd)/server/nginx-observer.conf -s stop

# Run in foreground mode (run.sh handles backgrounding)
daemon off;

# Must be set but nginx won't actually run as root on macOS
worker_processes auto;

# Temp paths (avoids permission issues with /var/log/nginx)
error_log /tmp/ob-k6-nginx-error.log;
pid       /tmp/ob-k6-nginx.pid;

events {
    worker_connections 1024;
}

http {
    # MIME types
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /tmp/ob-k6-nginx-access.log;

    # Performance
    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # Allow large media uploads (Observer handles files)
    client_max_body_size 500M;

    # Temp paths to avoid permission issues
    client_body_temp_path /tmp/ob-k6-nginx-body;
    proxy_temp_path       /tmp/ob-k6-nginx-proxy;
    fastcgi_temp_path     /tmp/ob-k6-nginx-fastcgi;

    server {
        listen 8080;
        server_name localhost;

        # OB_ROOT/public is the document root
        # This path is replaced by run.sh at startup
        root __OB_PUBLIC_ROOT__;

        index index.php;

        # Try static files first, then route through index.php (standard PHP app pattern)
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # REST-style /api/v1/ and /api/v2/ routes → api.php.
        # api.php parses $_SERVER['REQUEST_URI'] to dispatch to the right
        # controller (see public/api.php). Without this, v2 URLs fall through
        # to index.php which only knows about modules/ and returns 404.
        location ~ ^/api/(v1|v2)/ {
            fastcgi_pass   127.0.0.1:9099;
            include        /opt/homebrew/etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $document_root/api.php;
            fastcgi_param  SCRIPT_NAME    /api.php;
            fastcgi_read_timeout 120s;
            fastcgi_send_timeout 60s;
        }

        # PHP files → PHP-FPM on port 9099 (our dedicated k6 pool)
        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9099;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        /opt/homebrew/etc/nginx/fastcgi_params;

            # Generous timeouts for load testing (Observer can be slow under stress)
            fastcgi_read_timeout 120s;
            fastcgi_send_timeout 60s;
        }
    }
}
